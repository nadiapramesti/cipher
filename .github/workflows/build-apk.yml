name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan project Android
        run: |
          flutter --version
          flutter create . --project-name cipher --org com.nadiapramesti --platforms android
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Ambil package
        run: flutter pub get

      - name: Bikin ikon app
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E "^\s*(error|warning|info) " analyze.txt | head -40 | while read -r line; do
            case "$line" in
              error*) echo "::error::$line" ;;
              *) echo "::warning::$line" ;;
            esac
          done
          exit $code

      - name: Test
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            grep -E "Expected:|Actual:|Error:|error:|\.dart:[0-9]+:[0-9]+|FAILED|Some tests failed" test.txt | head -40 | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Kunci tanda tangan tetap (biar APK bisa update tanpa uninstall)
        env:
          KS: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Pakai kunci tetap"
          else
            echo "::warning::Secret SIDELOAD_KEYSTORE_B64 belum diisi, APK ditandatangani kunci acak"
          fi

      - name: Build APK
        run: |
          set +e
          flutter build apk --release --build-number=${{ github.run_number }} > build.txt 2>&1
          code=$?
          tail -80 build.txt
          if [ $code -ne 0 ]; then
            grep -iE "error|exception|failed" build.txt | head -40 | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Kasih nama APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Cipher-v0.2.${{ github.run_number }}.apk

      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Cipher v0.2.${{ github.run_number }}
          files: Cipher-v0.2.${{ github.run_number }}.apk
          body: |
            APK otomatis dari commit ${{ github.sha }}.
            Download file .apk di bawah, buka di HP Android, lalu install (izinkan "install dari sumber ini" kalau diminta).
